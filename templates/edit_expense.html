{% extends "base.html" %}
{% block title %}Edit Expense - Expense Tracker{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Edit Expense</h1>
</div>

<div class="form-card">
    <form method="POST" action="{{ url_for('edit_expense', expense_id=expense.id) }}" class="expense-form" novalidate>

        <div class="form-group">
            <label for="title">Expense Title *</label>
            <input type="text" id="title" name="title" value="{{ expense.title }}" required>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="amount">Amount (₹) *</label>
                <input type="number" id="amount" name="amount" step="0.01" min="0.01"
                       value="{{ expense.amount }}" required>
            </div>

            <div class="form-group">
                <label for="date">Date *</label>
                <input type="date" id="date" name="date" value="{{ expense.date }}" required>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="category">Category *</label>
                <select id="category" name="category" required>
                    {% for c in categories %}
                    <option value="{{ c }}" {% if expense.category == c %}selected{% endif %}>{{ c }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="payment_method">Payment Method *</label>
                <select id="payment_method" name="payment_method" required>
                    {% for p in payment_methods %}
                    <option value="{{ p }}" {% if expense.payment_method == p %}selected{% endif %}>{{ p }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class="form-group">
            <label for="description">Description (optional)</label>
            <textarea id="description" name="description" rows="3">{{ expense.description or '' }}</textarea>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Update Expense</button>
            <a href="{{ url_for('expenses_list') }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
