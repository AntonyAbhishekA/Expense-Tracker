{% extends "base.html" %}
{% block title %}Add Expense - Expense Tracker{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Add Expense</h1>
</div>

<div class="form-card">
    <form method="POST" action="{{ url_for('add_expense') }}" class="expense-form" novalidate>

        <div class="form-group">
            <label for="title">Expense Title *</label>
            <input type="text" id="title" name="title" placeholder="e.g. Grocery shopping"
                   value="{{ form_data.get('title', '') }}" required>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="amount">Amount (₹) *</label>
                <input type="number" id="amount" name="amount" step="0.01" min="0.01"
                       placeholder="0.00" value="{{ form_data.get('amount', '') }}" required>
            </div>

            <div class="form-group">
                <label for="date">Date *</label>
                <input type="date" id="date" name="date"
                       value="{{ form_data.get('date', '') }}" required>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="category">Category *</label>
                <select id="category" name="category" required>
                    <option value="" disabled {% if not form_data.get('category') %}selected{% endif %}>Select a category</option>
                    {% for c in categories %}
                    <option value="{{ c }}" {% if form_data.get('category') == c %}selected{% endif %}>{{ c }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="payment_method">Payment Method *</label>
                <select id="payment_method" name="payment_method" required>
                    <option value="" disabled {% if not form_data.get('payment_method') %}selected{% endif %}>Select a method</option>
                    {% for p in payment_methods %}
                    <option value="{{ p }}" {% if form_data.get('payment_method') == p %}selected{% endif %}>{{ p }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class="form-group">
            <label for="description">Description (optional)</label>
            <textarea id="description" name="description" rows="3"
                      placeholder="Any additional notes...">{{ form_data.get('description', '') }}</textarea>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Save Expense</button>
            <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}

{% block scripts %}
<script>
    // Default the date field to today if empty, for a nicer UX
    const dateInput = document.getElementById('date');
    if (dateInput && !dateInput.value) {
        dateInput.value = new Date().toISOString().split('T')[0];
    }
</script>
{% endblock %}
